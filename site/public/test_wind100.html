<!DOCTYPE html>
<html>
<head><title>Wind100 Test</title></head>
<body>
<h1>Wind100 Data Test</h1>
<pre id="output">Loading...</pre>
<script>
async function test() {
  const output = document.getElementById('output');
  try {
    // Test loading wind100 data
    const res = await fetch('/data/wind100/2020.json');
    output.textContent = `Status: ${res.status}\n`;
    
    if (!res.ok) {
      output.textContent += `Error: ${res.statusText}\n`;
      return;
    }
    
    const data = await res.json();
    output.textContent += `Year: ${data.year}\n`;
    output.textContent += `Total tracks: ${Object.keys(data.tracks).length}\n`;
    
    const firstTrackId = Object.keys(data.tracks)[0];
    const firstTrack = data.tracks[firstTrackId];
    output.textContent += `\nFirst track: ${firstTrackId}\n`;
    output.textContent += `Timesteps: ${Object.keys(firstTrack).length}\n`;
    
    const firstTimestamp = Object.keys(firstTrack)[0];
    output.textContent += `First timestamp: ${firstTimestamp}\n`;
    output.textContent += `First entry: ${JSON.stringify(firstTrack[firstTimestamp], null, 2)}\n`;
  } catch (e) {
    output.textContent += `Exception: ${e.message}\n${e.stack}`;
  }
}
test();
</script>
</body>
</html>
